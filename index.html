<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Back in Time — Chapter 2 (Prototype)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <canvas id="world" width="960" height="640"></canvas>
    <div id="hud">
      <div id="health">Health: <span id="health-value">100</span></div>
      <div id="hint">Use WASD to move • F to interact • Shift to sprint • Space to flash</div>
    </div>
  </div>

  <!-- Puzzle overlays -->
  <div id="puzzle-overlay" class="hidden">
    <div id="puzzle-box"></div>
    <button id="puzzle-close">Close (Esc)</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
